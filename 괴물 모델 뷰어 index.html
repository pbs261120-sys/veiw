<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>괴물 모델 뷰어</title>
<style>
:root{color-scheme:dark;--bg:#050507;--fg:#d8d0c4;--acc:#d8b878;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#050507;--fg:#d8d0c4}}
:root[data-theme="dark"]{--bg:#050507;--fg:#d8d0c4}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Serif KR",Georgia,serif;overflow:hidden;user-select:none;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:grab}canvas:active{cursor:grabbing}
#ttl{position:fixed;left:18px;top:14px;line-height:1.6;text-shadow:0 0 8px #000;pointer-events:none}
#ttl b{font-size:22px;letter-spacing:3px;color:var(--acc);font-weight:400;display:block}#ttl span{font-size:13px;opacity:.7}
#mode{position:fixed;right:18px;top:14px;font-size:15px;text-shadow:0 0 8px #000;text-align:right;pointer-events:none}
#bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(94vw,820px)}
button{font:inherit;font-size:15px;padding:10px 16px;background:#14100e;color:var(--fg);border:1px solid #4a4030;cursor:pointer;border-radius:3px}
button:hover{background:#221a16}button.on{background:#3a2a14;border-color:var(--acc);color:var(--acc)}
.sep{width:1px;background:#3a3226;margin:0 4px}
</style></head><body>
<div id="ttl"><b>괴물 모델 뷰어</b><span>드래그: 회전 · 휠/핀치: 확대·축소</span></div>
<div id="mode"></div>
<div id="bar">
<button id="m4" class="on">네 발 보행</button><button id="m2">두 발 보행</button><div class="sep"></div>
<button id="bw" class="on">걷기</button><button id="br">달리기(추격)</button><button id="bh">머리 비틀기</button><button id="bp">정지</button><div class="sep"></div>
<button id="ba" class="on">자동 회전</button><button id="bl">밝게 보기</button><button id="bc">카메라 초기화</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=Math.random,$=i=>document.getElementById(i);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x050507);sc.fog=new THREE.Fog(0x050507,14,34);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,80);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
const amb=new THREE.AmbientLight(0x6070a0,.35),key=new THREE.DirectionalLight(0xfff0d8,.8),rim=new THREE.DirectionalLight(0x5070ff,.7);key.position.set(3,6,6);rim.position.set(-4,4,-6);sc.add(amb,key,rim);
// floor (scrolls while the monster walks in place)
const gt=document.createElement('canvas');gt.width=gt.height=256;{const g=gt.getContext('2d');g.fillStyle='#14120f';g.fillRect(0,0,256,256);g.fillStyle='#1d1a15';g.fillRect(0,0,128,128);g.fillRect(128,128,128,128);g.strokeStyle='#3a342a';g.lineWidth=3;g.strokeRect(0,0,256,256);g.beginPath();g.moveTo(128,0);g.lineTo(128,256);g.moveTo(0,128);g.lineTo(256,128);g.stroke()}
const gtex=new THREE.CanvasTexture(gt);gtex.wrapS=gtex.wrapT=THREE.RepeatWrapping;gtex.repeat.set(12,12);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshLambertMaterial({map:gtex}));floor.rotation.x=-Math.PI/2;sc.add(floor);
// ---- monster model (same build as the game)
const L=c=>new THREE.MeshLambertMaterial({color:c});
const mon=new THREE.Group();sc.add(mon);
const DK=L(0x0c0a0e),DK2=L(0x1c1820),CL=new THREE.MeshLambertMaterial({color:0x1a141c,side:THREE.DoubleSide}),BG=new THREE.MeshLambertMaterial({color:0xb39b73,emissive:0x1a1408}),ST=L(0x4a2214),TH=new THREE.MeshLambertMaterial({color:0xd8cfae,emissive:0x2a2418}),BK=new THREE.MeshBasicMaterial({color:0}),EY=new THREE.MeshBasicMaterial({color:0xece4c4,fog:false}),RD=new THREE.MeshBasicMaterial({color:0xcc0000,fog:false});
const mk=(p,g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o},bx=(w,h,d)=>new THREE.BoxGeometry(w,h,d),sp=r=>new THREE.SphereGeometry(r,10,10);
const T=new THREE.Group();T.position.y=1.9;mon.add(T);
mk(T,bx(.9,.75,2.4),DK,0,0,.4);
for(let i=0;i<6;i++)mk(T,bx(1.02,.55,.05),DK2,0,-.12,-.6+i*.36);
for(let i=0;i<9;i++)mk(T,bx(.13,.22,.13),DK2,0,.42,-.8+i*.28);
for(let i=0;i<7;i++){const s=.2+R()*.2;mk(T,bx(s,s,s),DK2,(R()-.5)*.8,(R()-.5)*.6,-.6+R()*2)}
const strips=[];function strip(px,pz,len,w,ry){const g=new THREE.Group();g.position.set(px,-.2,pz);const m=mk(g,new THREE.PlaneGeometry(w,len),CL,0,-len/2,0);m.rotation.y=ry;T.add(g);strips.push(g)}
strip(.46,.9,1.6,.5,Math.PI/2);strip(-.46,.2,1.9,.5,Math.PI/2);strip(.46,-.3,1.3,.4,Math.PI/2);strip(-.46,1.2,1.2,.4,Math.PI/2);strip(0,-.9,1.4,.7,0);
const tails=[];[-.25,.25].forEach(x=>{const g=new THREE.Group();g.position.set(x,.45,-.7);const m=mk(g,new THREE.PlaneGeometry(.45,2.4),CL,0,0,-1.2);m.rotation.x=-Math.PI/2;T.add(g);tails.push(g)});
const N=new THREE.Group();N.position.set(0,.05,1.5);T.add(N);mk(N,bx(.2,.2,1.2),DK,0,0,.6);mk(N,bx(.3,.12,.3),DK2,0,.14,.3);mk(N,bx(.3,.12,.3),DK2,0,.14,.8);
const H=new THREE.Group();H.position.set(0,0,1.25);N.add(H);const eyes=[];
mk(H,bx(.76,.88,.76),DK,0,.1,-.12);mk(H,bx(.52,.7,.5),BG,0,0,.06).rotation.z=.08;mk(H,bx(.4,.1,.35),BG,0,.4,.02);mk(H,bx(.06,.45,.46),BG,.28,0,.06);mk(H,bx(.06,.45,.46),BG,-.28,0,.06);
mk(H,bx(.2,.25,.01),ST,.1,-.2,.315);mk(H,bx(.12,.3,.01),ST,-.15,-.05,.315);mk(H,bx(.05,.4,.01),ST,.06,-.5,.31);
mk(H,bx(.16,.12,.02),BK,-.13,.12,.32);mk(H,bx(.09,.2,.02),BK,.12,.1,.32);mk(H,bx(.06,.06,.02),BK,0,.27,.32);
[[.06,-.13,.12],[.04,.12,.1],[.025,0,.27]].forEach(a=>{const e=mk(H,sp(a[0]),EY,a[1],a[2],.3);eyes.push(e);mk(e,sp(a[0]*.4),RD,0,0,a[0]*.9)});
mk(H,bx(.36,.1,.02),BK,0,-.18,.32);for(let i=0;i<6;i++)mk(H,bx(.03,.08+R()*.06,.02),TH,-.14+i*.056,-.14-(i%2)*.07,.335);mk(H,bx(.02,.5,.02),BK,.2,0,.325);
H.add(new THREE.PointLight(0xff3010,.6,5,2));
function limb(x,l1,l2,w,fingers){const p=new THREE.Group();p.position.x=x;mk(p,bx(w,l1,w),DK,0,-l1/2,0);const e=new THREE.Group();e.position.y=-l1;p.add(e);mk(e,bx(w*.8,l2,w*.8),DK,0,-l2/2,0);mk(e,sp(w*.7),DK2,0,0,0);
 if(fingers){mk(e,bx(.2,.1,.3),DK,0,-l2,.1);for(let i=0;i<4;i++){const f=new THREE.Group();f.position.set(-.09+i*.06,-l2,.22);f.rotation.x=.5+i*.1;mk(f,bx(.025,.025,.6),DK,0,0,.3);e.add(f)}}p.userData.e=e;return p}
const mA=[limb(-.6,1,1.1,.17,1),limb(.6,1,1.1,.17,1)],mL=[limb(-.3,1,1,.2,0),limb(.3,1,1,.2,0)];mA.forEach(a=>mon.add(a));mL.forEach(l=>{l.position.y=1.9;mon.add(l)});
const ex=[[-.5,-.3,.1],[.5,-.3,.1],[-.5,-.3,.9],[.5,-.3,.9]].map(a=>{const l=limb(a[0],.9,1,.08,0);l.position.set(a[0],a[1],a[2]);T.add(l);return l});
// ---- animation state
let tm=0,mph=0,stand=0,standT=0,walking=true,run=false,hT=3,hy=0,hSn=0,auto=true,spd=0,paused=false;
function pose(dt,adt){
 stand+=(standT-stand)*Math.min(1,dt*2.2);
 spd=walking?(run?(standT?4.7:5):(standT?1.7:2.6)):0;mph+=adt*spd*2;
 const th=-(1.05-(run?.35:0))*stand,amp=run?1.4:1,s=Math.sin(mph)*(walking?1:0);
 T.rotation.x=th;T.scale.y=1+Math.sin(tm*2)*.03;
 mA.forEach((a,i)=>a.position.set(i?.6:-.6,1.9-Math.sin(th),Math.cos(th)));N.rotation.x=-th*.8+.35;
 const sg=i=>i?-1:1;
 mA.forEach((a,i)=>{a.rotation.x=sg(i)*s*.55*amp-.15*(1-stand);a.userData.e.rotation.x=-.45-Math.max(0,sg(i)*s)*.5});
 mL.forEach((l,i)=>{l.rotation.x=-sg(i)*s*.5*amp;l.userData.e.rotation.x=.6});
 mon.position.y=Math.abs(s)*.06;
 ex.forEach((e,i)=>{e.rotation.x=.3+Math.sin(tm*6+i*2)*.35+s*.4;e.userData.e.rotation.x=-.4+Math.sin(tm*9+i)*.3});
 strips.forEach((g,i)=>g.rotation.z=Math.sin(tm*2+i)*.2+(walking?.12:0));tails.forEach((g,i)=>g.rotation.y=Math.sin(tm*1.5+i*2)*.3);
 hT-=adt;if(hT<=0){hT=2+R()*3;hy=[-1.3,1.3,2.8,-2.8][(R()*4)|0];hSn=.2}if(hSn>0){hSn-=dt;if(hSn<=0)hy=0}
 H.rotation.y+=(hy-H.rotation.y)*Math.min(1,dt*(hy?25:8));H.rotation.z=.4+Math.sin(tm*13)*.03;
 eyes.forEach((e,i)=>e.scale.setScalar(1+Math.sin(tm*5+i*2)*.25));
 gtex.offset.y-=adt*spd/5}
// ---- orbit camera (drag / wheel / pinch)
const D0={yaw:.6,pit:.18,dist:9};let yaw=D0.yaw,pit=D0.pit,dist=D0.dist,dragging=false;const tgt=new THREE.Vector3(0,1.7,.2),pts=new Map(),el=ren.domElement;let pd=0;
el.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);dragging=true;el.setPointerCapture(e.pointerId);if(pts.size===2){const a=[...pts.values()];pd=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}});
el.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId),dx=e.clientX-p[0],dy=e.clientY-p[1];pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size===1){yaw-=dx*.006;pit=Math.max(-.25,Math.min(1.45,pit+dy*.005))}
 else if(pts.size===2){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)dist=Math.max(3,Math.min(22,dist*pd/d));pd=d}});
const up=e=>{pts.delete(e.pointerId);pd=0;if(!pts.size)dragging=false};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(3,Math.min(22,dist*(1+e.deltaY*.001)))},{passive:false});
// ---- buttons
const tog=(id,on)=>$(id).classList.toggle('on',on),label=()=>{$('mode').textContent=(standT?'두 발 보행':'네 발 보행')+(paused?' · 정지됨':walking?(run?' · 달리기':' · 걷기'):' · 정지')};
$('m4').onclick=()=>{standT=0;tog('m4',1);tog('m2',0);label()};$('m2').onclick=()=>{standT=1;tog('m2',1);tog('m4',0);label()};
$('bw').onclick=()=>{walking=!walking;tog('bw',walking);label()};$('br').onclick=()=>{run=!run;tog('br',run);if(run&&!walking){walking=true;tog('bw',1)}label()};
$('bh').onclick=()=>{hy=[-1.3,1.3,2.8,-2.8][(R()*4)|0];hSn=.35;hT=3+R()*2};
$('bp').onclick=()=>{paused=!paused;tog('bp',paused);label()};
$('ba').onclick=()=>{auto=!auto;tog('ba',auto)};
let bright=false;$('bl').onclick=()=>{bright=!bright;tog('bl',bright);amb.intensity=bright?1.1:.35;key.intensity=bright?1.8:.8;rim.intensity=bright?1.2:.7};
$('bc').onclick=()=>{yaw=D0.yaw;pit=D0.pit;dist=D0.dist};
label();
let last=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;const adt=paused?0:dt;tm+=adt;
 if(auto&&!dragging)yaw+=dt*.35;pose(dt,adt);
 const cp=Math.cos(pit);cam.position.set(tgt.x+Math.sin(yaw)*cp*dist,tgt.y+Math.sin(pit)*dist,tgt.z+Math.cos(yaw)*cp*dist);cam.lookAt(tgt);ren.render(sc,cam)}
requestAnimationFrame(loop);
</script></body></html>
